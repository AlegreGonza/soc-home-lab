title: Credential File Read via Sudo
id: 7c1e2a3d-4f5b-4a6c-8d9e-1a2b3c4d5e02
status: test
description: >
  Detects a sudo-elevated read of /etc/shadow or /etc/passwd — classic
  OS credential dumping, enabling offline password-hash cracking.
references:
  - internal: soc-home-lab/case-03
author: Gonzalo Alegre
date: 2026-09-29
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '/etc/shadow'
      - '/etc/passwd'
    User|exists: true
  filter_elevated:
    ParentImage|endswith: '/sudo'
  condition: selection and filter_elevated
falsepositives:
  - Legitimate administrative review of local account configuration
  - Configuration management tools (Ansible, Puppet) auditing user state
level: high
tags:
  - attack.credential_access
  - attack.t1003.008
