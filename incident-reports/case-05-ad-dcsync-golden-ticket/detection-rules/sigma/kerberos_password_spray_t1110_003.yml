title: Possible Kerberos Password Spray (10+ Failed Pre-Auth, Different Accounts)
id: a7c9e1b3-2d4f-4a8e-b5c6-7d8e9f0a1b2c
status: experimental
description: |
  Detects 10 or more failed Kerberos pre-authentication attempts (Event ID
  4771) against DIFFERENT target accounts from the same source IP within a
  60-second window. Unlike a brute-force against a single account, a
  password spray tries one (or a few) common password candidates against
  many accounts, to stay under per-account lockout thresholds while still
  covering a wide user base (e.g. kerbrute passwordspray).
references:
  - https://wazuh.com/blog/how-to-detect-active-directory-attacks-with-wazuh-part-1-of-2/
  - https://attack.mitre.org/techniques/T1110/003/
  - ../../README.md
author: soc-home-lab
date: 2026-10-11
tags:
  - attack.credential-access
  - attack.t1110.003
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4771
  condition: selection | count(distinct TargetUserName) by IpAddress >= 10
  timeframe: 60s
  group-by:
    - IpAddress
falsepositives:
  - A misconfigured application or script authenticating many service accounts
    in quick succession with an outdated shared password
  - Mass password rotation that briefly leaves several accounts with a
    just-changed password being retried by cached clients
level: high

# Native mapping notes
# ---------------------
# Wazuh rule 100050 (level 3): base selection logic, shared with the
#   brute-force rule — fires on every single Event 4771.
# Wazuh rule 100052 (level 12, frequency=10, timeframe=60): correlates
#   100050 by same ipAddress AND different targetUserName.
# Validated against real data: fired on 2026-10-11 19:58:31 against a real
# password spray run (10+ failures, distinct accounts, same source IP).
